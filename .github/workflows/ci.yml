name: ci
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Policy and unit tests
        run: python -m pytest -q
      - name: Corpus is up to date
        run: |
          python -m eval.corpus
          python -m eval.corpus_hard
          python -m eval.corpus_hard2
          git diff --exit-code eval/corpus
      - name: Red-team gate (fails if recall drops or false blocks rise)
        run: python -m eval.gate
